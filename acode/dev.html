height: 100%;\n  display: flex;\n  flex-direction: column;\n  min-height: 0;\n  background: radial-gradient(700px 400px at 50% 0%, rgba(176, 108, 255, 0.09), transparent 70%), #05070d;\n}\n.stage-view {\n  flex: 1;\n  min-height: 0;\n  display: grid;\n  place-items: center;\n  padding: 12px;\n  overflow: hidden;\n  position: relative;\n}\n.canvas-wrap {\n  position: relative;\n  box-shadow: var(--shadow);\n  border-radius: var(--r-sm);\n  overflow: hidden;\n  background: #000;\n  max-width: 100%;\n  max-height: 100%;\n}\n.canvas-wrap canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n.canvas-wrap.checker {\n  background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%),\n    linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%),\n    linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);\n  background-size: 20px 20px;\n  background-position: 0 0, 0 10px, 10px -10px, -10px 0;\n  background-color: #111;\n}\n.stage-overlay-badges {\n  position: absolute;\n  top: 18px;\n  inset-inline-start: 18px;\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n  max-width: 60%;\n  pointer-events: none;\n}\n.stage-empty {\n  text-align: center;\n  max-width: 430px;\n  padding: 20px;\n}\n.stage-empty .big-ico {\n  width: 68px;\n  height: 68px;\n  margin: 0 auto 14px;\n  border-radius: 20px;\n  background: var(--grad-soft);\n  border: 1px solid var(--line-2);\n  display: grid;\n  place-items: center;\n  color: var(--accent);\n}\n.transport {\n  flex: none;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 8px 12px;\n  border-top: 1px solid var(--line);\n  background: rgba(9, 12, 20, 0.85);\n  backdrop-filter: blur(8px);\n  flex-wrap: wrap;\n}\n.time-display {\n  font-family: var(--mono);\n  font-size: 13px;\n  letter-spacing: 0.5px;\n  padding: 5px 10px;\n  border-radius: var(--r-xs);\n  background: rgba(0, 0, 0, 0.4);\n  border: 1px solid var(--line);\n  direction: ltr;\n}\n.time-display .
